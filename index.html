<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, World</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #eaf6fb;
      font-family: system-ui, sans-serif;
    }
    h1 { color: #2d5a3d; }
    svg { width: min(80vw, 360px); height: auto; }
  </style>
</head>
<body>
  <h1>Hello, World!</h1>
  <svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A pink flower with a green stem and two leaves">
    <!-- stem -->
    <path d="M100 120 C95 180 105 230 100 290" fill="none" stroke="#3f8f4f" stroke-width="6" stroke-linecap="round"/>
    <!-- leaves -->
    <path d="M100 220 C70 200 50 205 40 190 C65 185 90 195 100 220 Z" fill="#4faa5f"/>
    <path d="M101 250 C130 232 150 236 162 220 C138 216 112 226 101 250 Z" fill="#4faa5f"/>
    <!-- petals -->
    <g transform="translate(100 80)" fill="#f48fb1" stroke="#d6648f" stroke-width="1.5">
      <ellipse cx="0" cy="-34" rx="16" ry="30"/>
      <ellipse cx="0" cy="-34" rx="16" ry="30" transform="rotate(45)"/>
      <ellipse cx="0" cy="-34" rx="16" ry="30" transform="rotate(90)"/>
      <ellipse cx="0" cy="-34" rx="16" ry="30" transform="rotate(135)"/>
      <ellipse cx="0" cy="-34" rx="16" ry="30" transform="rotate(180)"/>
      <ellipse cx="0" cy="-34" rx="16" ry="30" transform="rotate(225)"/>
      <ellipse cx="0" cy="-34" rx="16" ry="30" transform="rotate(270)"/>
      <ellipse cx="0" cy="-34" rx="16" ry="30" transform="rotate(315)"/>
    </g>
    <!-- center -->
    <circle cx="100" cy="80" r="18" fill="#ffd54f" stroke="#e0a800" stroke-width="2"/>
  </svg>
</body>
</html>
